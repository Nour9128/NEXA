version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexa-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: nexa_db
    ports:
      - "5432:5432"
    volumes:
      - nexa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexa-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/nexa_db?schema=public"
      JWT_SECRET: "nexa-production-super-secret-jwt-key-2026-secure"
      JWT_REFRESH_SECRET: "nexa-production-super-secret-refresh-key-2026-secure"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o-mini}"
      FRONTEND_URL: "http://localhost:5173"
    ports:
      - "4000:4000"
    volumes:
      - ./backend/uploads:/app/uploads

volumes:
  nexa_pgdata:
    driver: local
