<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="nexaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Orbit Ring -->
  <circle cx="50" cy="50" r="42" stroke="url(#nexaGrad)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.6"/>
  
  <!-- Interconnected Hexagonal Geometry -->
  <polygon points="50,18 78,34 78,66 50,82 22,66 22,34" stroke="url(#nexaGrad)" stroke-width="2.5" fill="none" opacity="0.8"/>
  
  <!-- Inner Dynamic Facets -->
  <line x1="50" y1="18" x2="50" y2="82" stroke="url(#nexaGrad)" stroke-width="1.5" opacity="0.4"/>
  <line x1="22" y1="34" x2="78" y2="66" stroke="url(#nexaGrad)" stroke-width="1.5" opacity="0.4"/>
  <line x1="22" y1="66" x2="78" y2="34" stroke="url(#nexaGrad)" stroke-width="1.5" opacity="0.4"/>

  <!-- Core Glowing Nodes -->
  <circle cx="50" cy="50" r="8" fill="url(#nexaGrad)" filter="url(#glow)"/>
  <circle cx="50" cy="18" r="4" fill="#38BDF8"/>
  <circle cx="78" cy="34" r="4" fill="#6366F1"/>
  <circle cx="78" cy="66" r="4" fill="#8B5CF6"/>
  <circle cx="50" cy="82" r="4" fill="#A855F7"/>
  <circle cx="22" cy="66" r="4" fill="#6366F1"/>
  <circle cx="22" cy="34" r="4" fill="#38BDF8"/>
</svg>
